<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">AI通知バッジの表示と、光を確認した後の変化</title>
  <desc id="desc">指示の開始で待機から作業中の緑の明滅へ、応答が終わると薄い青の光へ変わる。許可の確認中は緑のまま。フォーカス表示を切り替えると光が消え、作業中の記録があれば緑の明滅に戻り、なければ待機になる。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#438163"/></marker>
    <style>
      text { font-family: "Yu Gothic UI", "Meiryo", sans-serif; fill: #18392b; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #526b5e; }
      .line { fill: none; stroke: #438163; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="700" rx="20" fill="#f3f8f5"/>
  <text x="48" y="54" class="title">青く光るのは、応答が終わったときだけ</text>
  <text x="48" y="87" class="body">許可や質問で止まっていても、作業中の緑の明滅が続きます。</text>

  <rect x="48" y="150" width="300" height="176" rx="16" fill="#ffffff" stroke="#bfd3c7" stroke-width="2"/>
  <rect x="72" y="176" width="46" height="38" rx="8" fill="#eef4f0" stroke="#afc5b8" stroke-width="2"/>

  <text x="134" y="204" class="heading">待機</text>
  <text x="72" y="252" class="body">作業中の記録なし</text>
  <text x="72" y="281" class="body">未確認の通知なし</text>
  <text x="72" y="307" class="small">通常のカード</text>

  <path d="M348 238 H450" class="line"/>
  <text x="399" y="220" class="small" text-anchor="middle">指示を開始</text>
  <rect x="450" y="150" width="300" height="176" rx="16" fill="#ffffff" stroke="#72b48e" stroke-width="2"/>
  <rect x="474" y="176" width="46" height="38" rx="8" fill="none" stroke="#39aa6b" stroke-width="1.5"/>
  <text x="536" y="204" class="heading">作業中</text>
  <text x="474" y="252" class="body">開始イベントを受信</text>
  <text x="474" y="281" class="body">セッションを記録</text>
  <text x="474" y="307" class="small">枠がゆっくり明滅</text>

  <path d="M750 238 H852" class="line"/>
  <text x="801" y="220" class="small" text-anchor="middle">応答終了</text>
  <rect x="852" y="150" width="300" height="176" rx="16" fill="#e8f4fb" stroke="#7eafd0" stroke-width="2"/>
  <rect x="871" y="171" width="56" height="48" rx="12" fill="#9fd0f0" opacity="0.35"/>
  <rect x="876" y="176" width="46" height="38" rx="8" fill="#d7eef8" stroke="#7eb4d4" stroke-width="1.5"/>
  <text x="938" y="204" class="heading">光る</text>
  <text x="876" y="252" class="body">応答が終わった知らせ</text>
  <text x="876" y="281" class="body">成功・失敗の判定はしない</text>
  <text x="876" y="307" class="small">薄い青でぼんやり光る</text>

  <path d="M940 326 V392 H600 V326" class="line"/>
  <text x="616" y="380" class="small">光を消すと、作業が残っていれば緑へ</text>

  <path d="M1064 326 V456 H198 V326" class="line"/>
  <text x="220" y="444" class="small">光を消すと、作業がなければ待機へ</text>

  <rect x="48" y="494" width="1104" height="158" rx="16" fill="#ffffff" stroke="#bed7c9" stroke-width="2"/>
  <text x="72" y="529" class="heading">「光を確認する」操作</text>
  <text x="72" y="562" class="body">光っているスロットのフォーカス表示を切り替える（1面表示にする / 4面表示へ戻す）。</text>
  <text x="72" y="590" class="body">ウィンドウを前面へ出すだけでは消えません。残った作業があれば緑へ、なければ待機へ戻ります。</text>
  <text x="72" y="624" class="small">許可の確認中は緑のままです。中断は新しい光を付けません。終了通知が来ない作業中は、60分超で整理します。</text>
  <text x="48" y="681" class="small">図はカードの枠を例示。A〜D の文字は光らせません。標準・縮小・極小とも、細い枠で同じ状態を示します。</text>
</svg>
