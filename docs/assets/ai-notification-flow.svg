<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">AI のフックからスロットのバッジに通知が届くまで</title>
  <desc id="desc">3つのAIツールがイベントを発火し、共有PowerShellスクリプトが同じPCの名前付きパイプへ通知する。ハブがイベントを解釈して作業フォルダに一致するスロットのバッジを更新する。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#438163"/></marker>
    <style>
      text { font-family: "Yu Gothic UI", "Meiryo", sans-serif; fill: #18392b; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 21px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #526b5e; }
      .code { font-family: Consolas, "Yu Gothic UI", monospace; font-size: 16px; }
      .card { fill: #ffffff; stroke: #bed7c9; stroke-width: 2; }
      .line { fill: none; stroke: #438163; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="820" rx="20" fill="#f3f8f5"/>
  <text x="48" y="54" class="title">AI の応答終了は、フックを通してハブに届く</text>
  <text x="48" y="86" class="body">画面やチャットの監視ではなく、ツールが送る明示的なイベントを使います。</text>

  <rect x="48" y="120" width="344" height="112" rx="14" class="card"/>
  <text x="68" y="151" class="heading">1　Claude Code</text>
  <text x="68" y="179" class="code">~/.claude/settings.json</text>
  <text x="68" y="207" class="small">開始 / 応答終了 / 許可・質問待ち</text>
  <rect x="428" y="120" width="344" height="112" rx="14" class="card"/>
  <text x="448" y="151" class="heading">1　Codex</text>
  <text x="448" y="179" class="code">~/.codex/hooks.json</text>
  <text x="448" y="207" class="small">開始 / 応答終了 / 許可待ち / 中断</text>
  <rect x="808" y="120" width="344" height="112" rx="14" class="card"/>
  <text x="828" y="151" class="heading">1　GitHub Copilot</text>
  <text x="828" y="178" class="code">~/.copilot/hooks/</text>
  <text x="828" y="202" class="code">turtle-ai-quartet-hub.json</text>
  <text x="828" y="222" class="small">開始 / 応答終了</text>

  <path d="M220 232 V256 H600 M980 232 V256 H600 M600 232 V278" fill="none" stroke="#438163" stroke-width="2.5"/>
  <path d="M600 256 V278" class="line"/>
  <rect x="250" y="284" width="700" height="104" rx="14" fill="#e6f3eb" stroke="#70a88a" stroke-width="2"/>
  <text x="274" y="316" class="heading">2　共通の通知スクリプトを実行</text>
  <text x="274" y="345" class="code">~/.turtle-ai-quartet-hub/ai-notify.ps1</text>
  <text x="274" y="372" class="small">引数のツール名・イベント名 ＋ 標準入力JSONの作業フォルダなど</text>
  <path d="M600 388 V418 H220 V442" class="line"/>

  <rect x="48" y="448" width="344" height="146" rx="14" class="card"/>
  <text x="68" y="481" class="heading">3　同じPCのパイプへ送信</text>
  <text x="68" y="511" class="code">TurtleAIQuartetHub.Commands</text>
  <text x="68" y="540" class="body">イベント・作業フォルダ・</text>
  <text x="68" y="566" class="body">セッションIDなどを渡す</text>
  <path d="M392 521 H422" class="line"/>

  <rect x="428" y="448" width="344" height="146" rx="14" class="card"/>
  <text x="448" y="481" class="heading">4　ハブが通知を受け取る</text>
  <text x="448" y="511" class="code">--ai-event</text>
  <text x="448" y="540" class="body">開始 / 応答終了などに分類</text>
  <text x="448" y="566" class="small">通知でハブを前面へ出さない</text>
  <path d="M772 521 H802" class="line"/>

  <rect x="808" y="448" width="344" height="146" rx="14" class="card"/>
  <text x="828" y="481" class="heading">5　対象スロットを選ぶ</text>
  <text x="828" y="511" class="body">作業フォルダ（cwd）を照合</text>
  <text x="828" y="540" class="body">同じフォルダ / その配下</text>
  <text x="828" y="566" class="small">最も深く一致する管理スロットへ</text>
  <path d="M980 594 V620 H600 V638" class="line"/>

  <rect x="48" y="644" width="1104" height="110" rx="14" fill="#173e2b"/>
  <text x="72" y="677" font-size="22" font-weight="700" fill="#f3fff7" style="fill:#f3fff7">6　スロットのバッジに反映</text>
  <rect x="72" y="696" width="42" height="34" rx="7" fill="#254c37" stroke="#c4d9cd"/>
  <text x="86" y="720" class="body" style="fill:#e4eee8">A</text>
  <text x="130" y="720" class="body" style="fill:#d9e8df">待機</text>
  <rect x="284" y="696" width="42" height="34" rx="7" fill="#254c37" stroke="#77eaa7" stroke-width="3"/>
  <text x="298" y="720" class="body" style="fill:#c8fadd">B</text>
  <text x="342" y="720" class="body" style="fill:#e6fff0">作業中：枠がゆっくり明滅</text>
  <rect x="650" y="692" width="50" height="42" rx="10" fill="#8bf0b5" opacity="0.20"/>
  <rect x="654" y="696" width="42" height="34" rx="7" fill="#72dfa1" stroke="#b0f2cd"/>
  <text x="668" y="720" class="body" style="fill:#11351f">C</text>
  <text x="712" y="720" class="body" style="fill:#e6fff0">応答終了・許可待ち：光る</text>

  <text x="48" y="793" class="small">ハブ未起動中は送信を終了。通知の保存・再送は行いません。  ／  「完了」は応答終了の通知で、作業の成功判定ではありません。</text>
</svg>
