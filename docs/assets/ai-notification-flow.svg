<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">AI のフックからスロットのバッジに通知が届くまで</title>
  <desc id="desc">5つのAIツールがイベントを発火し、共有PowerShellスクリプトが同じPCの名前付きパイプへ通知する。カルテットハブがイベントを解釈して作業フォルダに一致するスロットのバッジを更新する。色はツールごとに変えない。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#438163"/></marker>
    <style>
      text { font-family: "Yu Gothic UI", "Meiryo", sans-serif; fill: #18392b; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 21px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #526b5e; }
      .code { font-family: Consolas, "Yu Gothic UI", monospace; font-size: 16px; }
      .card { fill: #ffffff; stroke: #bed7c9; stroke-width: 2; }
      .line { fill: none; stroke: #438163; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="820" rx="20" fill="#f3f8f5"/>
  <text x="48" y="54" class="title">今の実装では、次の順でカルテットハブに届きます</text>
  <text x="48" y="86" class="body">画面やチャットは見ません。各ツールの設定ファイルから、同じスクリプトを呼びます。</text>

  <rect x="48" y="120" width="210" height="112" rx="14" class="card"/>
  <text x="60" y="146" class="heading" style="font-size:18px">1　Claude Code</text>
  <text x="60" y="175" class="code" style="font-size:12px">~/.claude/settings.json</text>
  <text x="60" y="212" class="small" style="font-size:13.5px">開始 / 終了。確認中は緑</text>

  <rect x="271" y="120" width="210" height="112" rx="14" class="card"/>
  <text x="283" y="146" class="heading" style="font-size:18px">1　Codex</text>
  <text x="283" y="175" class="code" style="font-size:12px">~/.codex/hooks.json</text>
  <text x="283" y="212" class="small" style="font-size:13.5px">開始 / 終了。中断は光なし</text>

  <rect x="494" y="120" width="210" height="112" rx="14" class="card"/>
  <text x="506" y="146" class="heading" style="font-size:18px">1　GitHub Copilot</text>
  <text x="506" y="173" class="code" style="font-size:12px">~/.copilot/hooks/</text>
  <text x="506" y="191" class="code" style="font-size:12px">turtle-ai-quartet-hub.json</text>
  <text x="506" y="216" class="small" style="font-size:13.5px">開始 / 応答終了</text>

  <rect x="717" y="120" width="210" height="112" rx="14" class="card"/>
  <text x="729" y="146" class="heading" style="font-size:18px">1　Grok</text>
  <text x="729" y="173" class="code" style="font-size:12px">~/.grok/hooks/</text>
  <text x="729" y="191" class="code" style="font-size:12px">turtle-ai-quartet-hub.json</text>
  <text x="729" y="216" class="small" style="font-size:13.5px">開始 / 終了。確認中は緑</text>

  <rect x="940" y="120" width="210" height="112" rx="14" class="card"/>
  <text x="952" y="146" class="heading" style="font-size:18px">1　Antigravity</text>
  <text x="952" y="173" class="code" style="font-size:12px">~/.gemini/config/</text>
  <text x="952" y="191" class="code" style="font-size:12px">hooks.json</text>
  <text x="952" y="216" class="small" style="font-size:13.5px">開始 / 終了。中断は光なし</text>

  <path d="M153 232 V256 H1045 M376 232 V256 M599 232 V256 M822 232 V256 M1045 232 V256" fill="none" stroke="#438163" stroke-width="2.5"/>
  <path d="M600 256 V278" class="line"/>
  <rect x="250" y="284" width="700" height="104" rx="14" fill="#e6f3eb" stroke="#70a88a" stroke-width="2"/>
  <text x="274" y="316" class="heading">2　共通の通知スクリプトを実行</text>
  <text x="274" y="345" class="code">~/.turtle-ai-quartet-hub/ai-notify.ps1</text>
  <text x="274" y="372" class="small">引数のツール名・イベント名 ＋ 標準入力JSONの作業フォルダなど</text>
  <path d="M600 388 V418 H220 V442" class="line"/>

  <rect x="48" y="448" width="344" height="146" rx="14" class="card"/>
  <text x="68" y="481" class="heading">3　同じPCのパイプへ送信</text>
  <text x="68" y="511" class="code">TurtleAIQuartetHub.Commands</text>
  <text x="68" y="540" class="body">イベント・作業フォルダ・</text>
  <text x="68" y="566" class="body">セッションIDなどを渡す</text>
  <path d="M392 521 H422" class="line"/>

  <rect x="428" y="448" width="344" height="146" rx="14" class="card"/>
  <text x="448" y="481" class="heading">4　カルテットハブが受け取る</text>
  <text x="448" y="511" class="code">--ai-event</text>
  <text x="448" y="540" class="body">開始 / 応答終了などに分類</text>
  <text x="448" y="566" class="small">カルテットハブは前面に出ない</text>
  <path d="M772 521 H802" class="line"/>

  <rect x="808" y="448" width="344" height="146" rx="14" class="card"/>
  <text x="828" y="481" class="heading">5　対象スロットを選ぶ</text>
  <text x="828" y="511" class="body">作業フォルダ（cwd）を照合</text>
  <text x="828" y="540" class="body">作業フォルダと配下</text>
  <text x="828" y="566" class="small">最も深く一致する管理スロットへ</text>
  <path d="M980 594 V620 H600 V638" class="line"/>

  <rect x="48" y="644" width="1104" height="110" rx="14" fill="#173e2b"/>
  <text x="72" y="677" font-size="22" font-weight="700" fill="#f3fff7" style="fill:#f3fff7">6　スロットのカードと A〜D アイコンに反映</text>
  <rect x="72" y="696" width="42" height="34" rx="7" fill="none" stroke="#c4d9cd"/>
  <text x="130" y="720" class="body" style="fill:#d9e8df">待機</text>
  <rect x="284" y="696" width="42" height="34" rx="7" fill="none" stroke="#77eaa7" stroke-width="1.5"/>
  <rect x="289" y="701" width="11" height="11" rx="3" fill="#223027" stroke="#8af2b5" stroke-width="1.2"/>
  <text x="342" y="720" class="body" style="fill:#e6fff0">作業中：枠とアイコン枠がゆっくり明滅</text>
  <rect x="710" y="692" width="50" height="42" rx="10" fill="#228BE0" opacity="0.5"/>
  <rect x="714" y="696" width="42" height="34" rx="7" fill="#112D46" stroke="#3EA3EC" stroke-width="1.5"/>
  <rect x="719" y="701" width="11" height="11" rx="3" fill="#174F85" stroke="#68C1FF" stroke-width="1.2"/>
  <text x="772" y="720" class="body" style="fill:#E7F5FC">応答が終わると青い点灯</text>

  <text x="48" y="793" class="small">カルテットハブを閉じているあいだは再送しません。青い光は応答終了だけ。許可の確認中は緑のままです。</text>
</svg>
