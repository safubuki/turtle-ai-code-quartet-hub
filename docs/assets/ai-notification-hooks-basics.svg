<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AIの状態と、状態ごとに動くフック、カルテットハブの光</title>
  <desc id="desc">作業開始では緑の明滅。許可や質問の確認中も緑のまま。応答が終わったときだけ薄い青。入力待ちの idle_prompt などは表示を変えない。4つのツールで色は同じ。</desc>
  <defs>
    <style>
      text { font-family: "Yu Gothic UI", "Meiryo", sans-serif; fill: #18392b; }
      .title { font-size: 28px; font-weight: 700; }
      .heading { font-size: 20px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 14px; fill: #526b5e; }
      .code { font-family: Consolas, "Yu Gothic UI", monospace; font-size: 13px; fill: #24543a; }
      .card { fill: #ffffff; stroke: #bed7c9; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="20" fill="#f3f8f5"/>
  <text x="36" y="48" class="title">フックは、AIの決まった瞬間に鳴る呼び出しです</text>
  <text x="36" y="78" class="body">カルテットハブは会話を読まず、鳴った種類だけを受け取り、A〜D のバッジの光を変えます。</text>

  <rect x="28" y="104" width="270" height="448" rx="16" class="card"/>
  <rect x="36" y="122" width="6" height="412" rx="3" fill="#39aa6b"/>
  <text x="48" y="140" class="heading">1　作業が始まる</text>
  <text x="48" y="170" class="body">あなたが指示を送った瞬間です。</text>
  <text x="48" y="194" class="body">AIは、作業を始めます。</text>
  <text x="48" y="234" class="small">開始時のフック</text>
  <text x="48" y="260" class="code">UserPromptSubmit</text>
  <text x="48" y="282" class="code">userPromptSubmitted</text>
  <text x="48" y="308" class="small">Claude / Codex / Grok と</text>
  <text x="48" y="328" class="small">Copilot で名前が違います。</text>
  <rect x="48" y="360" width="42" height="34" rx="8" fill="#eef8f1" stroke="#39aa6b" stroke-width="3"/>
  <text x="61" y="383" class="heading" style="fill:#23834d">A</text>
  <text x="102" y="384" class="heading">緑に明滅</text>
  <text x="48" y="422" class="body">バッジの枠が、ゆっくり</text>
  <text x="48" y="446" class="body">緑に明滅します。</text>
  <text x="48" y="490" class="small">4ツールとも、作業中の色は</text>
  <text x="48" y="510" class="small">同じ緑です。</text>

  <rect x="316" y="104" width="270" height="448" rx="16" class="card"/>
  <rect x="324" y="122" width="6" height="412" rx="3" fill="#39aa6b"/>
  <text x="336" y="140" class="heading">2　確認を求めている</text>
  <text x="336" y="170" class="body">許可や質問で止まっても、</text>
  <text x="336" y="194" class="body">作業の途中です。</text>
  <text x="336" y="234" class="small">届いても表示は変えない</text>
  <text x="336" y="260" class="code">permission_prompt</text>
  <text x="336" y="282" class="code">elicitation_dialog</text>
  <text x="336" y="304" class="code">PermissionRequest</text>
  <rect x="336" y="348" width="42" height="34" rx="8" fill="#eef8f1" stroke="#39aa6b" stroke-width="3"/>
  <text x="349" y="371" class="heading" style="fill:#23834d">A</text>
  <text x="390" y="372" class="heading">緑のまま</text>
  <text x="336" y="414" class="body">緑の明滅が続きます。</text>
  <text x="336" y="442" class="body">青い光にはしません。</text>
  <text x="336" y="486" class="small">Copilot に許可の知らせが</text>
  <text x="336" y="506" class="small">無くても、同じ緑です。</text>

  <rect x="604" y="104" width="270" height="448" rx="16" class="card"/>
  <rect x="612" y="122" width="6" height="412" rx="3" fill="#3E7EAD"/>
  <text x="624" y="140" class="heading">3　応答が終わる</text>
  <text x="624" y="170" class="body">答えを出した、失敗した、</text>
  <text x="624" y="194" class="body">途中で止まったときです。</text>
  <text x="624" y="234" class="small">終了時のフック</text>
  <text x="624" y="260" class="code">Stop / agentStop</text>
  <text x="624" y="282" class="code">StopFailure</text>
  <text x="624" y="304" class="code">StopCancelled</text>
  <rect x="624" y="348" width="42" height="34" rx="8" fill="#3E7EAD" stroke="#D7EEFB" stroke-width="2"/>
  <text x="637" y="371" class="heading" style="fill:#F7FCFF">A</text>
  <text x="678" y="372" class="heading">薄い青</text>
  <text x="624" y="414" class="body">成功か失敗かは判定しません。</text>
  <text x="624" y="442" class="body">「終わった」と知らせる光です。</text>
  <text x="624" y="486" class="small">Codex の中断だけは、</text>
  <text x="624" y="506" class="small">新しい光を付けません。</text>

  <rect x="892" y="104" width="276" height="448" rx="16" class="card"/>
  <rect x="900" y="122" width="6" height="412" rx="3" fill="#91A99A"/>
  <text x="912" y="140" class="heading">4　光らせないもの</text>
  <text x="912" y="170" class="body">次の入力を待っているだけ、</text>
  <text x="912" y="194" class="body">といった知らせです。</text>
  <text x="912" y="234" class="small">届いても無視するフック</text>
  <text x="912" y="260" class="code">idle_prompt</text>
  <text x="912" y="282" class="code">task_complete</text>
  <text x="912" y="304" class="code">PermissionDenied</text>
  <rect x="912" y="348" width="42" height="34" rx="8" fill="#eef4f0" stroke="#afc5b8" stroke-width="2"/>
  <text x="925" y="371" class="heading" style="fill:#647d6e">A</text>
  <text x="966" y="372" class="heading">変えない</text>
  <text x="912" y="414" class="body">消したばかりの光が、</text>
  <text x="912" y="442" class="body">また付くのを防ぎます。</text>
  <text x="912" y="486" class="small">知らない種類の知らせも、</text>
  <text x="912" y="506" class="small">同じように無視します。</text>

  <rect x="28" y="572" width="1140" height="156" rx="16" fill="#ffffff" stroke="#bed7c9" stroke-width="2"/>
  <text x="48" y="606" class="heading">カルテットハブへの働きかけは、光を変えることだけです</text>
  <text x="48" y="642" class="body">渡すもの: ツールの名前、起きたことの名前、作業フォルダ、セッションの番号。</text>
  <text x="48" y="670" class="body">渡さないもの: 指示文、返答文、チャット画面、ファイルの中身。</text>
  <text x="48" y="698" class="body">カルテットハブは AI の作業を止めたり続けさせたりせず、一致したスロットのバッジだけを変えます。</text>
</svg>
