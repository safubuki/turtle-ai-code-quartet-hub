<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">シーン別 UI アニメーション一覧マップ</title>
  <desc id="desc">アプリ本体の起動終了、表示モード切替、ワークスペースの起動と終了、AI作業状態の5つのシーンで使い分けているアニメーションの時間・加減速カーブ・狙いを一覧にした図。</desc>
  <defs>
    <style>
      text { font-family: "Yu Gothic UI", "Meiryo", sans-serif; fill: #18392b; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #466154; }
      .card-title { font-size: 19px; font-weight: 700; }
      .badge { font-size: 13px; font-weight: 700; fill: #145938; }
      .badge-blue { font-size: 13px; font-weight: 700; fill: #135488; }
      .label { font-size: 14px; font-weight: 700; fill: #2a4f3d; }
      .body { font-size: 14px; fill: #264235; }
      .small { font-size: 13px; fill: #526b5e; }
      .mono { font-family: Consolas, "Yu Gothic UI", monospace; font-size: 13px; fill: #1c4e35; }
      .mini-mint { font-size: 11px; font-weight: 700; fill: #c6fae0; }
      .mini-soft { font-size: 11px; font-weight: 700; fill: #e4f7ec; }
      .mini-blue { font-size: 11px; font-weight: 700; fill: #dff2ff; }
      .mini-led { font-size: 12px; font-weight: 700; fill: #d6fde7; }
      .mini-time { font-size: 10.5px; font-weight: 600; fill: #93e8b9; }
      .mini-sub { font-size: 10px; fill: #a4d9bc; }
    </style>
  </defs>

  <rect width="1200" height="800" rx="20" fill="#f3f8f5"/>
  <text x="48" y="52" class="title">シーン別 UI アニメーション一覧 — 何をどう動かすか</text>
  <text x="48" y="82" class="subtitle">操作の意味に合わせて「時間・加減速カーブ・光の量・間の取り方」を使い分け、心地よさと品格を両立します。</text>

  <!-- 1. アプリ本体の起動・終了 -->
  <rect x="48" y="108" width="352" height="314" rx="16" fill="#ffffff" stroke="#b9d4c5" stroke-width="2"/>
  <rect x="68" y="128" width="136" height="26" rx="13" fill="#dff4e8"/>
  <text x="136" y="146" class="badge" text-anchor="middle">1. 本体 起動・終了</text>
  <text x="68" y="182" class="card-title">静かに浮かび、霧のように消える</text>

  <!-- ミニ模式図 -->
  <rect x="68" y="198" width="312" height="68" rx="10" fill="#101512"/>
  <rect x="92" y="214" width="76" height="40" rx="6" fill="#1b2620" stroke="#45d483" stroke-width="1.2" opacity="0.45"/>
  <path d="M180 232 H214" stroke="#5ee398" stroke-width="2" fill="none"/>
  <polygon points="214,227 224,232 214,237" fill="#5ee398"/>
  <rect x="236" y="209" width="84" height="44" rx="6" fill="#151b18" stroke="#5ee398" stroke-width="1.8"/>
  <text x="278" y="236" class="mini-mint" text-anchor="middle">ふわっと浮上</text>

  <text x="68" y="290" class="label">時間 / カーブ</text>
  <text x="68" y="311" class="mono">起動 920ms / 終了 680ms · Sine InOut</text>
  <text x="68" y="338" class="label">手法とポイント</text>
  <text x="68" y="359" class="body">・最小 3 層の軽量透過影武者（Blur 不使用）</text>
  <text x="68" y="380" class="body">・起動前 120ms+70ms 待機で冒頭コマ飛び防止</text>
  <text x="68" y="401" class="body">・+12px 浮上 / 0.965→1.0 / ほのかな 1.5px 緑縁</text>

  <!-- 2. 表示モード切替 -->
  <rect x="424" y="108" width="352" height="314" rx="16" fill="#ffffff" stroke="#b9d4c5" stroke-width="2"/>
  <rect x="444" y="128" width="136" height="26" rx="13" fill="#dff4e8"/>
  <text x="512" y="146" class="badge" text-anchor="middle">2. モード切替</text>
  <text x="444" y="182" class="card-title">標準 ⇄ 縮小 ⇄ 極小モーフ</text>

  <!-- ミニ模式図 -->
  <rect x="444" y="198" width="312" height="68" rx="10" fill="#101512"/>
  <rect x="466" y="208" width="76" height="48" rx="6" fill="#19221d" stroke="#45d483" stroke-width="1.5"/>
  <text x="504" y="236" class="mini-soft" text-anchor="middle">標準</text>
  <path d="M550 232 H574" stroke="#5ee398" stroke-width="1.8" fill="none"/>
  <rect x="582" y="219" width="66" height="26" rx="5" fill="#19221d" stroke="#45d483" stroke-width="1.5"/>
  <text x="615" y="236" class="mini-soft" text-anchor="middle">縮小</text>
  <path d="M656 232 H680" stroke="#5ee398" stroke-width="1.8" fill="none"/>
  <rect x="688" y="216" width="32" height="32" rx="6" fill="#19221d" stroke="#5ee398" stroke-width="1.6"/>
  <text x="704" y="236" class="mini-mint" text-anchor="middle">極小</text>

  <text x="444" y="290" class="label">時間 / カーブ</text>
  <text x="444" y="311" class="mono">340ms · Cubic EaseInOut（きびきび変形）</text>
  <text x="444" y="338" class="label">手法とポイント</text>
  <text x="444" y="359" class="body">・本物を隠した裏で 1 回だけ同期リサイズ</text>
  <text x="444" y="380" class="body">・Stretch=None 中央切抜で文字のにじみゼロ</text>
  <text x="444" y="401" class="body">・本物の cloak 解除後 60ms で影武者を閉鎖</text>

  <!-- 5. AI 作業状態フィードバック -->
  <rect x="800" y="108" width="352" height="314" rx="16" fill="#ffffff" stroke="#b5d0e8" stroke-width="2"/>
  <rect x="820" y="128" width="152" height="26" rx="13" fill="#e1f0fc"/>
  <text x="896" y="146" class="badge-blue" text-anchor="middle">5. AI 作業状態の通知</text>
  <text x="820" y="182" class="card-title">周囲を巡る緑と、完了の青い呼吸</text>

  <!-- ミニ模式図 -->
  <rect x="820" y="198" width="312" height="68" rx="10" fill="#101512"/>
  <rect x="842" y="210" width="122" height="44" rx="7" fill="#141c17" stroke="#2c3a32" stroke-width="1.2"/>
  <path d="M849 210 H920" stroke="#5ee398" stroke-width="2.6" stroke-linecap="round"/>
  <text x="903" y="237" class="mini-mint" text-anchor="middle">作業中：緑 LED 周回</text>
  <rect x="984" y="210" width="126" height="44" rx="7" fill="#112d46" stroke="#3ea3ec" stroke-width="1.6"/>
  <text x="1047" y="237" class="mini-blue" text-anchor="middle">完了：青ホタル点滅</text>

  <text x="820" y="290" class="label">時間 / カーブ</text>
  <text x="820" y="311" class="mono">周回 3.60s(標準) / 完了点滅 3.0s 周期</text>
  <text x="820" y="338" class="label">手法とポイント</text>
  <text x="820" y="359" class="body">・作業中は 28 段トレイルが枠線角丸に沿って周回</text>
  <text x="820" y="380" class="body">・完了は Opacity 水平接線曲線で滑らかに明滅</text>
  <text x="820" y="401" class="body">・通常操作の妨げにならない低主張の常時演出</text>

  <!-- 3. ワークスペース起動（単体・4面一括） -->
  <rect x="48" y="446" width="540" height="304" rx="16" fill="#ffffff" stroke="#89c9a3" stroke-width="2.2"/>
  <rect x="68" y="466" width="212" height="26" rx="13" fill="#d7f3e3"/>
  <text x="174" y="484" class="badge" text-anchor="middle">3. ワークスペース起動（単体 / 4面）</text>
  <text x="68" y="518" class="card-title">完全遮蔽 → 一拍 → 1つずつ LED ランプ点灯</text>

  <!-- ミニ模式図 -->
  <rect x="68" y="532" width="500" height="72" rx="10" fill="#070a08"/>
  <rect x="82" y="544" width="104" height="48" rx="6" fill="#123020" stroke="#74e8a8" stroke-width="1.8"/>
  <text x="134" y="566" class="mini-led" text-anchor="middle">A 点灯</text>
  <text x="134" y="582" class="mini-time" text-anchor="middle">0.00s</text>

  <rect x="202" y="544" width="104" height="48" rx="6" fill="#11271c" stroke="#53c785" stroke-width="1.5"/>
  <text x="254" y="566" class="mini-led" text-anchor="middle">B 点灯</text>
  <text x="254" y="582" class="mini-time" text-anchor="middle">+0.48s</text>

  <rect x="322" y="544" width="104" height="48" rx="6" fill="#0f1f17" stroke="#3f9a67" stroke-width="1.3"/>
  <text x="374" y="566" class="mini-led" text-anchor="middle">C 点灯</text>
  <text x="374" y="582" class="mini-time" text-anchor="middle">+0.96s</text>

  <rect x="442" y="544" width="104" height="48" rx="6" fill="#0d1712" stroke="#337651" stroke-width="1.2"/>
  <text x="494" y="566" class="mini-led" text-anchor="middle">D 点灯</text>
  <text x="494" y="582" class="mini-time" text-anchor="middle">+1.44s</text>

  <text x="68" y="628" class="label">タイミング / カーブ</text>
  <text x="68" y="649" class="mono">カバー 320ms → 一拍 260ms(黒幕抜け) → 480ms刻み点灯 → 580ms Sine InOut</text>
  <text x="68" y="676" class="label">体験上の狙い</text>
  <text x="68" y="697" class="body">・黒全画面シールド＋象限ベールで初期全画面や十字隙間のチラつきを完全封印</text>
  <text x="68" y="718" class="body">・準備中は静謐に抑え、整ってから 1 つずつランプが灯るように開いて品格を演出</text>

  <!-- 4. ワークスペース終了（すべて閉じる・個別） -->
  <rect x="612" y="446" width="540" height="304" rx="16" fill="#ffffff" stroke="#89c9a3" stroke-width="2.2"/>
  <rect x="632" y="466" width="224" height="26" rx="13" fill="#d7f3e3"/>
  <text x="744" y="484" class="badge" text-anchor="middle">4. ワークスペース終了（一括 / 個別）</text>
  <text x="632" y="518" class="card-title">完了知覚のワンクッション → 一斉に「フッ」消散</text>

  <!-- ミニ模式図 -->
  <rect x="632" y="532" width="500" height="72" rx="10" fill="#070a08"/>
  <rect x="646" y="546" width="132" height="44" rx="6" fill="#131b17" stroke="#45d483" stroke-width="1.2"/>
  <text x="712" y="566" class="mini-soft" text-anchor="middle">裏で個別終了</text>
  <text x="712" y="581" class="mini-sub" text-anchor="middle">差は見せない</text>

  <path d="M786 568 H808" stroke="#5ee398" stroke-width="1.8" fill="none"/>
  <rect x="814" y="546" width="150" height="44" rx="6" fill="#142d20" stroke="#74e8a8" stroke-width="1.6"/>
  <text x="889" y="566" class="mini-led" text-anchor="middle">完了ワンクッション</text>
  <text x="889" y="581" class="mini-time" text-anchor="middle">720ms 静止知覚</text>

  <path d="M972 568 H994" stroke="#5ee398" stroke-width="1.8" fill="none"/>
  <rect x="1000" y="546" width="118" height="44" rx="6" fill="#131b17" stroke="#5ee398" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="1059" y="566" class="mini-mint" text-anchor="middle">全層一斉消散</text>
  <text x="1059" y="581" class="mini-time" text-anchor="middle">420ms「フッ」</text>

  <text x="632" y="628" class="label">タイミング / カーブ</text>
  <text x="632" y="649" class="mono">カバー 300ms → 完了待機 720ms(単体460ms) → 一斉 420ms Cubic Out</text>
  <text x="632" y="676" class="label">体験上の狙い</text>
  <text x="632" y="697" class="body">・裏で早く落ちる窓／遅く落ちる窓の差を完全不透明ベール＋黒幕で完全遮断</text>
  <text x="632" y="718" class="body">・完了を人が知覚する 0.72 秒の間を置いてから全層同時に軽やかに消え失せる</text>

  <text x="48" y="778" class="small">※ すべての演出は Windows の「アニメーションを表示する」設定に追従し、オフ時・OS シャットダウン時・外部終了（--exit）時は即時処理します。</text>
</svg>
